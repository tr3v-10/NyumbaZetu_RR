{% extends "shared/base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="max-width:400px;width:100%;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:3rem;margin-bottom:12px;">🔒</div>
      <div class="auth-form-title">Reset Password</div>
      <div class="auth-form-sub">Enter your email to receive a reset link</div>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input class="form-control" type="email" name="email" placeholder="your@email.com" required/>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>
        <p style="text-align:center;margin-top:16px;font-size:0.875rem;"><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
