{% extends "shared/base.html" %}
{% block title %}403 — Forbidden{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;">
  <div>
    <div style="font-size:6rem;font-family:var(--font-head);font-weight:700;color:var(--accent);opacity:0.3;line-height:1;">403</div>
    <h2 style="font-family:var(--font-head);font-size:1.6rem;margin:12px 0;">Forbidden</h2>
    <p class="text-muted" style="max-width:400px;margin:0 auto 28px;">You don't have permission to access this resource.</p>
    <div class="d-flex gap-3 justify-center flex-wrap">
      <a href="/" class="btn btn-primary"><i class="bi bi-house"></i> Go Home</a>
      <button onclick="history.back()" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Go Back</button>
    </div>
  </div>
</div>
{% endblock %}
